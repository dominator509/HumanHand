[project]
name = "humanhand"
version = "1.1.0rc1"
description = "Local-first document style fidelity, fact integrity, and clean-room import/export CLI"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    {name = "dominator509"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing",
]
keywords = ["style-fidelity", "fact-integrity", "privacy", "clean-room", "cli"]
dependencies = [
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
    "openai>=1.30,<2",
    "pydantic>=2,<3",
    "pypdf>=5,<7",
    "defusedxml>=0.7,<1",
    "cryptography>=50,<53",
    "reportlab>=4,<5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "pytest>=9,<10",
    "pytest-cov>=5,<6",
    "pytest-asyncio>=1,<2",
    "respx>=0.21,<1",
    "bandit>=1.7,<2",
    "pip-audit>=2,<3",
    "build>=1,<2",
    "hatchling>=1,<2",
]

[project.urls]
Homepage = "https://github.com/dominator509/humanhand"
Repository = "https://github.com/dominator509/humanhand"

[project.scripts]
humanhand = "humanhand.cli.root_app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/humanhand"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "live: tests that require live network (deselect by default)",
    "live_e2e: end-to-end tests that require live services (deselect by default)",
    "slow: tests that are slow (deselect by default)",
    "importers: focused clean-room import pipeline tests (EP-012)",
]
addopts = "-v --strict-markers --tb=short"

[tool.coverage.run]
source = ["src/humanhand"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 85
