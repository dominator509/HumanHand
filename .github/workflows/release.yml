name: Release Candidate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.11.16"
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ARTIFACT_NAME: humanhand-release-${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build-release-bundle:
    name: Build and inspect one release bundle
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload-release.outputs.artifact-id }}
      artifact_url: ${{ steps.upload-release.outputs.artifact-url }}
      artifact_digest: ${{ steps.upload-release.outputs.artifact-digest }}
      artifact_name: ${{ steps.release-metadata.outputs.artifact-name }}
      candidate_sha: ${{ steps.release-metadata.outputs.candidate-sha }}

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install frozen development dependencies
        run: sh scripts/install.sh
        shell: bash

      - name: Verify source candidate
        run: sh scripts/verify.sh
        shell: bash

      - name: Build reproducible release bundle
        run: sh scripts/build-release-bundle.sh
        shell: bash
        env:
          HUMANHAND_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          RELEASE_BUNDLE_DIR: release-bundle

      - name: Record release metadata
        id: release-metadata
        shell: bash
        run: |
          printf 'candidate-sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          printf 'artifact-name=%s\n' "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release bundle
        id: upload-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  verify-exact-artifact:
    name: Verify exact artifact (${{ matrix.os }})
    needs: build-release-bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out verification tooling at the candidate SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.build-release-bundle.outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download the exact release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-release-bundle.outputs.artifact_name }}
          path: release-bundle

      - name: Verify and clean-install the exact wheel
        shell: bash
        run: >-
          sh scripts/verify-release-bundle.sh
          release-bundle
          "${{ needs.build-release-bundle.outputs.candidate_sha }}"

  release-gate:
    name: Produce automated release-gate evidence
    needs: [build-release-bundle, verify-exact-artifact]
    if: ${{ always() && needs.build-release-bundle.result == 'success' && needs.verify-exact-artifact.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out gate tooling at the candidate SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.build-release-bundle.outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download the verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-release-bundle.outputs.artifact_name }}
          path: release-bundle

      - name: Write scoped release-gate evidence
        shell: bash
        env:
          RELEASE_ARTIFACT_ID: ${{ needs.build-release-bundle.outputs.artifact_id }}
          RELEASE_ARTIFACT_URL: ${{ needs.build-release-bundle.outputs.artifact_url }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.build-release-bundle.outputs.artifact_digest }}
        run: |
          mkdir -p release-gate
          python scripts/release_bundle.py gate \
            --bundle-dir release-bundle \
            --expected-sha "${{ needs.build-release-bundle.outputs.candidate_sha }}" \
            --output release-gate/RELEASE_GATE.json \
            --artifact-name "${{ needs.build-release-bundle.outputs.artifact_name }}" \
            --artifact-id "$RELEASE_ARTIFACT_ID" \
            --artifact-url "$RELEASE_ARTIFACT_URL" \
            --artifact-digest "$RELEASE_ARTIFACT_DIGEST" \
            --attestation-status unavailable

      - name: Upload release-gate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: humanhand-release-gate-${{ needs.build-release-bundle.outputs.candidate_sha }}
          path: release-gate/RELEASE_GATE.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false

      - name: Confirm no publication occurred
        shell: bash
        run: echo "release candidate verified; no tag, release, deployment, or PyPI publish performed"

  report-release-status:
    name: Report release-candidate status
    needs: [build-release-bundle, verify-exact-artifact, release-gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Publish atomic classic commit statuses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RESULT: ${{ needs.build-release-bundle.result }}
          VERIFY_RESULT: ${{ needs.verify-exact-artifact.result }}
          GATE_RESULT: ${{ needs.release-gate.result }}
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.request

          results = {
              "humanhand/release-build": os.environ["BUILD_RESULT"],
              "humanhand/release-install": os.environ["VERIFY_RESULT"],
              "humanhand/release-gate": os.environ["GATE_RESULT"],
          }
          repository = os.environ["GITHUB_REPOSITORY"]
          candidate_sha = os.environ["CANDIDATE_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          target_url = f"https://github.com/{repository}/actions/runs/{run_id}"

          def status_state(result: str) -> str:
              if result == "success":
                  return "success"
              if result == "failure":
                  return "failure"
              return "error"

          def post(context: str, state: str, description: str) -> None:
              payload = json.dumps(
                  {
                      "state": state,
                      "target_url": target_url,
                      "description": description[:140],
                      "context": context,
                  }
              ).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/statuses/{candidate_sha}",
                  data=payload,
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 201:
                      raise SystemExit(f"unexpected status API response: {response.status}")

          for context, result in results.items():
              post(context, status_state(result), f"Workflow result: {result}")

          success = all(result == "success" for result in results.values())
          summary = "; ".join(
              f"{context.removeprefix('humanhand/release-')}={result}"
              for context, result in results.items()
          )
          post(
              "humanhand/release-candidate",
              "success" if success else "failure",
              summary,
          )
          print(f"reported release statuses for {candidate_sha}: {summary}")
          PY
