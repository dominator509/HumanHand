name: Setup uv with retries
description: >-
  Wraps astral-sh/setup-uv (pinned to the same SHA used by this repository's
  release workflow) with up to 3 attempts and back-off. astral-sh/setup-uv
  performs a required versions-manifest fetch against
  https://raw.githubusercontent.com/astral-sh/versions/main/v1/uv.ndjson on a
  single 5-second timeout with no retry; a transient failure of that fetch
  fails the entire job before any repo code runs. The retry steps are skipped
  entirely on a successful first attempt, and the third attempt carries no
  continue-on-error, so three consecutive failures still fail the job.
inputs:
  version:
    description: "The uv version to install (passed through to astral-sh/setup-uv)."
    required: true
  enable-cache:
    description: "Whether setup-uv enables its uv cache (passed through to astral-sh/setup-uv)."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install uv (attempt 1 of 3)
      id: setup-uv-1
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      continue-on-error: true
      with:
        version: ${{ inputs.version }}
        enable-cache: ${{ inputs.enable-cache }}

    - name: Wait before retry (15s)
      if: ${{ steps.setup-uv-1.outcome != 'success' }}
      shell: bash
      run: sleep 15

    - name: Install uv (attempt 2 of 3)
      id: setup-uv-2
      if: ${{ steps.setup-uv-1.outcome != 'success' }}
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      continue-on-error: true
      with:
        version: ${{ inputs.version }}
        enable-cache: ${{ inputs.enable-cache }}

    - name: Wait before final retry (30s)
      if: ${{ steps.setup-uv-1.outcome != 'success' && steps.setup-uv-2.outcome != 'success' }}
      shell: bash
      run: sleep 30

    - name: Install uv (attempt 3 of 3, final)
      id: setup-uv-3
      if: ${{ steps.setup-uv-1.outcome != 'success' && steps.setup-uv-2.outcome != 'success' }}
      # No continue-on-error here: three consecutive failures still fail the job.
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: ${{ inputs.version }}
        enable-cache: ${{ inputs.enable-cache }}
